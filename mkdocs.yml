site_name: 钝角的日常
site_description: 钝角的个人网站，记录日常、课程、工作与生活。
site_url: https://dunjiao.top

theme:
  name: material
  language: zh
  font: false
  favicon: assets/images/logo.svg
  logo: assets/images/logo.svg
  palette:
    - scheme: default
      primary: white
      accent: indigo
  features:
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/posting.js

plugins:
  - search

copyright: Copyright © 2026 钝角 — 用 <a href="https://www.mkdocs.org">MkDocs</a> 构建

nav:
  - 主页: index.md
  - 课程:
      - 课程首页: course/index.md
      - 经济法: course/jingjifa/index.md
      - 宪法: course/xianfa/index.md
  - 美食: food/index.md
  - 工作: about/index.md
  - 生活: life/index.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
